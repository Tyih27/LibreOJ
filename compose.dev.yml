services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: libreoj
      MARIADB_USER: libreoj
      MARIADB_PASSWORD: libreoj
      MARIADB_ROOT_PASSWORD: libreoj-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - libreoj-mariadb:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - libreoj-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - libreoj-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/libreoj-files

volumes:
  libreoj-mariadb:
  libreoj-redis:
  libreoj-minio:
